<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TurfArena - Admin Facility Gateway</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700;1,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Theme CSS -->
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        position: relative;
      }

      .admin-auth-box {
        background: var(--card-bg);
        border: 1px solid var(--line-strong);
        border-radius: 28px;
        width: 100%;
        max-width: 420px;
        padding: 40px 32px;
        box-shadow: var(--shadow-glass), var(--shadow-neon-soft);
        position: relative;
        z-index: 10;
        animation: modalAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes modalAppear {
        from { opacity: 0; transform: scale(0.96) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }

      .admin-logo-icon {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        background: var(--surface-3);
        border: 1px solid var(--line-lime);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
        font-size: 24px;
        box-shadow: var(--shadow-neon-soft);
        margin: 0 auto 14px;
      }
    </style>
  </head>

  <body>
    <!-- Ambient Glow Layer -->
    <div class="ambient-glow-mesh" aria-hidden="true">
      <div class="glow-orb-1"></div>
      <div class="glow-orb-2"></div>
    </div>

    <div class="admin-auth-box">
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="admin-logo-icon">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 style="font-size: 22px; font-weight: 800; color: var(--text-main);">
          Admin <span class="text-lime-gradient">Command Suite</span>
        </h1>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
          Master access for turf operators and venue directors
        </p>
      </div>

      <div id="loginError" style="display: none; background: rgba(255, 82, 82, 0.12); border: 1px solid var(--danger); color: var(--danger); padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 16px;">
        Invalid credentials. (Hint: admin@turfarena.com / admin123)
      </div>

      <form id="adminLoginForm" style="display: flex; flex-direction: column; gap: 14px;">
        <div>
          <label style="font-size: 11px; font-family: var(--font-mono); text-transform: uppercase; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 4px;">Admin Email</label>
          <input type="email" id="adminEmail" class="input-premium" placeholder="admin@turfarena.com" value="admin@turfarena.com" required />
        </div>

        <div>
          <label style="font-size: 11px; font-family: var(--font-mono); text-transform: uppercase; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 4px;">Password</label>
          <input type="password" id="adminPassword" class="input-premium" placeholder="••••••••" value="admin123" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; margin-top: 8px;">
          <i class="fa-solid fa-key"></i> Authenticate & Enter Suite
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center; border-top: 1px solid var(--line-soft); padding-top: 16px;">
        <a href="index.html" style="color: var(--text-muted); font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
          <i class="fa-solid fa-arrow-left"></i> Back to Public App
        </a>
      </div>
    </div>

    <!-- Scripts -->
    <script src="theme-toggle.js"></script>
    <script>
      document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("adminEmail").value.trim();
        const password = document.getElementById("adminPassword").value.trim();
        const errorEl = document.getElementById("loginError");

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.error || "Authentication failed.");
          }

          if (data.user.role !== "admin") {
            // Invalidate session if non-admin attempts to log into admin portal
            await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
            throw new Error("Access denied: Account does not have administrator privileges.");
          }

          window.location.href = "admin-dashboard.html";
        } catch (err) {
          errorEl.textContent = err.message || "Invalid credentials.";
          errorEl.style.display = "block";
          setTimeout(() => {
            errorEl.style.display = "none";
          }, 4000);
        }
      });
    </script>
  </body>
</html>
