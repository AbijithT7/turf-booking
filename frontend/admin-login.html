<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TurfArena - Admin Facility Gateway</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" href="favicon.ico" />
    <script>
      try {
        const t = localStorage.getItem("turf_theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700;1,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Theme CSS -->
    <link rel="stylesheet" href="theme.css" />
    <style>
      .auth-layout {
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-6) var(--space-4);
        position: relative;
        z-index: 10;
      }

      .admin-auth-card {
        background: var(--card-bg);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 420px;
        padding: var(--space-6) var(--space-6);
        box-shadow: var(--shadow-elevated);
        position: relative;
      }

      .admin-logo-icon {
        width: 48px;
        height: 48px;
        border-radius: var(--radius-md);
        background: var(--surface-3);
        border: 1px solid var(--line-lime);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
        font-size: 22px;
        box-shadow: var(--shadow-neon-soft);
        margin: 0 auto var(--space-3);
      }

      .input-field-group {
        margin-bottom: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
      }

      .input-field-label {
        font-size: 11px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      @media (max-width: 480px) {
        .auth-layout {
          padding: 16px 10px;
        }
        .admin-auth-card {
          padding: 20px 14px;
        }
      }
    </style>
  </head>

  <body class="page-auth">
    <!-- Layered Sports Background System -->
    <div class="sports-bg-layer" aria-hidden="true">
      <div class="sports-bg-stadium"></div>
      <div class="sports-bg-turf-stripes"></div>
      <div class="sports-bg-pitch-lines"></div>
      <div class="sports-bg-court-geometry"></div>
    </div>

    <!-- Global Standard Header -->
    <header class="global-header">
      <div class="navbar-inner">
        <!-- LEFT: Brand Logo -->
        <a class="logo" href="index.html" aria-label="TurfArena Home">
          <img src="logo.png" alt="TurfArena Logo" class="logo-image-brand" />
          <div class="logo-text">
            <span class="logo-brand">TURF<span>ARENA</span></span>
            <span class="logo-sub">HQ Facility Control</span>
          </div>
        </a>

        <!-- CENTER: Navigation Links -->
        <nav class="top-nav" aria-label="Main Navigation">
          <a href="index.html" class="nav-link" data-nav="home">
            <i class="fa-solid fa-house"></i> Home
          </a>
          <a href="index.html#available-turfs" class="nav-link" data-nav="book">
            <i class="fa-solid fa-calendar-check"></i> Book Turf
          </a>
          <a href="community.html" class="nav-link" data-nav="community">
            <i class="fa-solid fa-users"></i> Community
          </a>
          <a href="tournaments.html" class="nav-link" data-nav="tournaments">
            <i class="fa-solid fa-trophy"></i> Tournaments
          </a>
        </nav>

        <!-- RIGHT: Theme Toggle & Controls -->
        <div class="header-actions">
          <button class="theme-toggle-btn" data-theme-toggle type="button" aria-label="Toggle theme"></button>
          <div id="userAuthActions" class="auth-actions-slot">
            <div class="admin-badge-indicator">
              <i class="fa-solid fa-shield"></i> Facility Admin Gateway
            </div>
          </div>
          <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Toggle menu" onclick="toggleMobileNav()">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
      </div>

      <!-- Mobile Dropdown Navigation -->
      <div class="mobile-nav-drawer" id="mobileNavDrawer">
        <a href="index.html" class="mobile-nav-link" data-nav="home" onclick="closeMobileNav()">
          <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="index.html#available-turfs" class="mobile-nav-link" data-nav="book" onclick="closeMobileNav()">
          <i class="fa-solid fa-calendar-check"></i> Book Turf
        </a>
        <a href="community.html" class="mobile-nav-link" data-nav="community" onclick="closeMobileNav()">
          <i class="fa-solid fa-users"></i> Community
        </a>
        <a href="tournaments.html" class="mobile-nav-link" data-nav="tournaments" onclick="closeMobileNav()">
          <i class="fa-solid fa-trophy"></i> Tournaments
        </a>
        <div id="mobileAuthSlot" class="mobile-auth-slot">
          <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-soft);">
            <div class="admin-badge-indicator" style="width: 100%; justify-content: center;">
              <i class="fa-solid fa-shield"></i> Facility Admin Gateway
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="auth-layout">
      <div class="admin-auth-card">
        <div style="text-align: center; margin-bottom: var(--space-5);">
          <img src="logo.png" alt="TurfArena Logo" style="width: 52px; height: 52px; object-fit: cover; border-radius: var(--radius-md); border: 1px solid var(--line-lime); box-shadow: var(--shadow-neon-soft); margin: 0 auto var(--space-3);" />
          <h1 style="font-size: 22px; font-weight: 800; color: var(--text-main);">
            Facility Management
          </h1>
          <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
            Turf operator credentials required for master slot console
          </p>
        </div>

        <div id="loginError" style="display: none; background: rgba(239, 68, 68, 0.12); border: 1px solid var(--danger); color: var(--danger); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; text-align: center; margin-bottom: var(--space-4);" role="alert">
          Invalid credentials.
        </div>

        <form id="adminLoginForm" style="display: flex; flex-direction: column; gap: var(--space-4);">
          <div class="input-field-group">
            <label class="input-field-label" for="adminEmail">Admin Email</label>
            <input type="email" id="adminEmail" class="input-premium" placeholder="Admin email" autocomplete="username" required />
          </div>

          <div class="input-field-group">
            <label class="input-field-label" for="adminPassword">Password</label>
            <input type="password" id="adminPassword" class="input-premium" placeholder="Password" autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: var(--space-2);">
            <i class="fa-solid fa-lock"></i> Sign In to Admin Console
          </button>
        </form>

        <div style="margin-top: var(--space-5); text-align: center; border-top: 1px solid var(--line-soft); padding-top: var(--space-4); display: flex; justify-content: space-between; align-items: center; font-size: 12.5px;">
          <a href="index.html" style="color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-arrow-left"></i> Back to TurfArena
          </a>
          <span style="color: var(--text-muted); font-size: 11px; display: inline-flex; align-items: center; gap: 4px;">
            <i class="fa-solid fa-lock"></i> Staff Gateway
          </span>
        </div>
      </div>
    </main>

    <!-- Scripts -->
    <script src="theme-toggle.js"></script>
    <script>
      document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("adminEmail").value.trim();
        const password = document.getElementById("adminPassword").value.trim();
        const errorEl = document.getElementById("loginError");

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.error || "Authentication failed.");
          }

          if (data.user.role !== "admin") {
            await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
            if (window.invalidateAuthCache) window.invalidateAuthCache();
            localStorage.removeItem("currentUser");
            throw new Error("Access denied: Account does not have administrator privileges.");
          }

          localStorage.setItem("currentUser", JSON.stringify(data.user));
          if (window.invalidateAuthCache) window.invalidateAuthCache();
          window.location.href = "admin-dashboard.html";
        } catch (err) {
          errorEl.textContent = err.message || "Invalid credentials.";
          errorEl.style.display = "block";
          setTimeout(() => {
            errorEl.style.display = "none";
          }, 4000);
        }
      });
    </script>
  </body>
</html>
