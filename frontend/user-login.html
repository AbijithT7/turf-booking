<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TurfArena - Player Sign In & Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const t = localStorage.getItem("turf_theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700;1,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Theme CSS -->
    <link rel="stylesheet" href="theme.css" />
    <style>
      .auth-layout {
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-6) var(--space-4);
        position: relative;
        z-index: 10;
      }

      .auth-card {
        background: var(--card-bg);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 440px;
        padding: var(--space-6) var(--space-6);
        box-shadow: var(--shadow-elevated);
        position: relative;
      }

      .auth-logo-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: var(--space-5);
      }

      .auth-logo-icon {
        width: 48px;
        height: 48px;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, var(--primary) 0%, #15803d 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #050a0d;
        font-size: 22px;
        box-shadow: var(--shadow-neon-soft);
        margin-bottom: var(--space-3);
      }

      .auth-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: var(--surface-2);
        padding: var(--space-1);
        border-radius: var(--radius-md);
        border: 1px solid var(--line-soft);
        margin-bottom: var(--space-5);
      }

      .auth-tab-btn {
        padding: 9px;
        border-radius: var(--radius-sm);
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-weight: 700;
        font-size: 13.5px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
        font-family: var(--font-main);
      }

      .auth-tab-btn.active {
        background: var(--primary);
        color: var(--on-primary);
        box-shadow: var(--shadow-neon-soft);
      }

      .input-field-group {
        margin-bottom: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
      }

      .input-field-label {
        font-size: 11px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .message-box {
        font-size: 13px;
        text-align: center;
        min-height: 20px;
        margin-top: var(--space-3);
        font-weight: 600;
      }

      .message-box.error {
        color: var(--danger);
      }

      .message-box.success {
        color: var(--primary);
      }
    </style>
  </head>

  <body class="page-auth">
    <!-- Layered Sports Background System -->
    <div class="sports-bg-layer" aria-hidden="true">
      <div class="sports-bg-stadium"></div>
      <div class="sports-bg-turf-stripes"></div>
      <div class="sports-bg-pitch-lines"></div>
      <div class="sports-bg-court-geometry"></div>
    </div>

    <!-- Global Standard Header -->
    <header class="global-header">
      <div class="navbar-inner">
        <!-- LEFT: Brand Logo -->
        <a class="logo" href="index.html" aria-label="TurfArena Home">
          <div class="logo-icon">
            <i class="fa-solid fa-crown"></i>
          </div>
          <div class="logo-text">
            <span class="logo-brand">TURF<span>ARENA</span></span>
            <span class="logo-sub">Book. Play. Connect.</span>
          </div>
        </a>

        <!-- CENTER: Navigation Links -->
        <nav class="top-nav" aria-label="Main Navigation">
          <a href="index.html" class="nav-link">
            <i class="fa-solid fa-house"></i> Home
          </a>
          <a href="index.html#available-turfs" class="nav-link">
            <i class="fa-solid fa-calendar-check"></i> Book Turf
          </a>
          <a href="community.html" class="nav-link">
            <i class="fa-solid fa-users"></i> Community
          </a>
          <a href="community.html#tournaments" class="nav-link">
            <i class="fa-solid fa-trophy"></i> Tournaments
          </a>
        </nav>

        <!-- RIGHT: Theme Toggle & Controls -->
        <div class="header-actions">
          <button class="theme-toggle-btn" data-theme-toggle type="button" aria-label="Toggle theme"></button>
          <div id="userAuthActions" class="auth-actions-slot">
            <a href="index.html" class="btn btn-outline btn-sm">
              <i class="fa-solid fa-arrow-left"></i> Home
            </a>
          </div>
          <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Toggle menu" onclick="toggleMobileNav()">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
      </div>

      <!-- Mobile Dropdown Navigation -->
      <div class="mobile-nav-drawer" id="mobileNavDrawer">
        <a href="index.html" class="mobile-nav-link" onclick="closeMobileNav()">
          <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="index.html#available-turfs" class="mobile-nav-link" onclick="closeMobileNav()">
          <i class="fa-solid fa-calendar-check"></i> Book Turf
        </a>
        <a href="community.html" class="mobile-nav-link" onclick="closeMobileNav()">
          <i class="fa-solid fa-users"></i> Community
        </a>
        <a href="community.html#tournaments" class="mobile-nav-link" onclick="closeMobileNav()">
          <i class="fa-solid fa-trophy"></i> Tournaments
        </a>
        <a href="admin-login.html" class="mobile-nav-link" onclick="closeMobileNav()">
          <i class="fa-solid fa-shield"></i> Admin Portal
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="auth-layout">
      <div class="auth-card">
        <!-- Logo Header -->
        <div class="auth-logo-header">
          <div class="auth-logo-icon">
            <i class="fa-solid fa-crown"></i>
          </div>
          <h1 style="font-size: 22px; font-weight: 800; color: var(--text-main);">
            Player Portal
          </h1>
          <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
            Instant pitch reservations & team matchmaking
          </p>
        </div>

        <!-- Segmented Switcher -->
        <div class="auth-tabs">
          <button class="auth-tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">
            <i class="fa-solid fa-lock"></i> Sign In
          </button>
          <button class="auth-tab-btn" id="tabRegister" onclick="switchAuthTab('register')">
            <i class="fa-solid fa-user-plus"></i> Sign Up
          </button>
        </div>

        <!-- Form -->
        <form id="authForm" onsubmit="handleAuthSubmit(event)">
          <!-- Name (Register Only) -->
          <div class="input-field-group" id="groupName" style="display: none;">
            <label class="input-field-label" for="authName">Full Name</label>
            <input type="text" id="authName" class="input-premium" placeholder="e.g. Alex Morgan" />
          </div>

          <!-- Email -->
          <div class="input-field-group">
            <label class="input-field-label" for="authEmail">Email Address</label>
            <input type="email" id="authEmail" class="input-premium" placeholder="name@example.com" required />
          </div>

          <!-- Phone (Register Only) -->
          <div class="input-field-group" id="groupPhone" style="display: none;">
            <label class="input-field-label" for="authPhone">Mobile Number (10 digits)</label>
            <input type="tel" id="authPhone" class="input-premium" placeholder="9876543210" />
          </div>

          <!-- Password -->
          <div class="input-field-group">
            <label class="input-field-label" for="authPassword">Password</label>
            <input type="password" id="authPassword" class="input-premium" placeholder="At least 6 characters" required />
          </div>

          <button type="submit" class="btn btn-primary" id="authSubmitBtn" style="width: 100%; padding: 12px; margin-top: var(--space-2);">
            Sign In to TurfArena
          </button>

          <div id="authMessage" class="message-box" role="status" aria-live="polite"></div>
        </form>

        <!-- Sub Links -->
        <div style="margin-top: var(--space-5); text-align: center; border-top: 1px solid var(--line-soft); padding-top: var(--space-4); display: flex; justify-content: space-between; align-items: center; font-size: 12.5px;">
          <a href="index.html" style="color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-arrow-left"></i> Home
          </a>
          <a href="admin-login.html" style="color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-shield"></i> Facility Admin
          </a>
        </div>
      </div>
    </main>

    <!-- Scripts -->
    <script src="theme-toggle.js"></script>
    <script>
      let mode = "login";

      function switchAuthTab(newMode) {
        mode = newMode;
        document.getElementById("tabLogin").classList.toggle("active", mode === "login");
        document.getElementById("tabRegister").classList.toggle("active", mode === "register");

        document.getElementById("groupName").style.display = mode === "register" ? "flex" : "none";
        document.getElementById("groupPhone").style.display = mode === "register" ? "flex" : "none";

        document.getElementById("authSubmitBtn").textContent = mode === "login" ? "Sign In to TurfArena" : "Create Player Account";
        document.getElementById("authMessage").textContent = "";
      }

      async function handleAuthSubmit(e) {
        e.preventDefault();
        const msg = document.getElementById("authMessage");
        msg.className = "message-box";
        msg.textContent = "";

        const email = document.getElementById("authEmail").value.trim();
        const password = document.getElementById("authPassword").value;

        if (mode === "login") {
          try {
            const res = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Login failed");

            localStorage.setItem("currentUser", JSON.stringify(data.user));
            msg.className = "message-box success";
            msg.textContent = "Welcome back! Redirecting...";
            setTimeout(() => {
              window.location.href = data.user.role === "admin" ? "admin-dashboard.html" : "index.html";
            }, 700);
          } catch (err) {
            msg.className = "message-box error";
            msg.textContent = err.message;
          }
        } else {
          const name = document.getElementById("authName").value.trim();
          const phone = document.getElementById("authPhone").value.trim();

          if (!name || !phone) {
            msg.className = "message-box error";
            msg.textContent = "Please fill in all registration fields.";
            return;
          }

          if (!/^\d{10}$/.test(phone)) {
            msg.className = "message-box error";
            msg.textContent = "Please enter a valid 10-digit mobile number.";
            return;
          }

          try {
            const res = await fetch("/api/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ name, email, phone, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Registration failed");

            localStorage.setItem("currentUser", JSON.stringify(data.user));
            msg.className = "message-box success";
            msg.textContent = "Account created! Redirecting...";
            setTimeout(() => {
              window.location.href = "index.html";
            }, 700);
          } catch (err) {
            msg.className = "message-box error";
            msg.textContent = err.message;
          }
        }
      }

      // Check existing session on load
      window.onload = async () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("mode") === "signup") {
          switchAuthTab("register");
        }

        try {
          const checkRes = await fetch("/api/auth/me", { credentials: "include" });
          if (checkRes.ok) {
            const data = await checkRes.json();
            if (data.user) {
              localStorage.setItem("currentUser", JSON.stringify(data.user));
              window.location.href = data.user.role === "admin" ? "admin-dashboard.html" : "index.html";
            }
          }
        } catch (e) {}
      };
    </script>
  </body>
</html>
