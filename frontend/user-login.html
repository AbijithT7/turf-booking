<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TurfArena - Athlete Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700;1,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Theme CSS -->
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        position: relative;
      }

      .auth-box {
        background: var(--card-bg);
        border: 1px solid var(--line-strong);
        border-radius: 28px;
        width: 100%;
        max-width: 440px;
        padding: 40px 32px;
        box-shadow: var(--shadow-glass), var(--shadow-neon-soft);
        position: relative;
        z-index: 10;
        animation: modalAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes modalAppear {
        from { opacity: 0; transform: scale(0.96) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }

      .auth-logo-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 24px;
      }

      .auth-logo-icon {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--primary) 0%, #22c55e 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #050a0d;
        font-size: 24px;
        box-shadow: var(--shadow-neon-soft);
        margin-bottom: 12px;
      }

      .auth-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: var(--surface-2);
        padding: 4px;
        border-radius: 14px;
        border: 1px solid var(--line-soft);
        margin-bottom: 24px;
      }

      .auth-tab-btn {
        padding: 10px;
        border-radius: 10px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-weight: 700;
        font-size: 13.5px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
        font-family: var(--font-main);
      }

      .auth-tab-btn.active {
        background: var(--primary);
        color: var(--on-primary);
        box-shadow: var(--shadow-neon-soft);
      }

      .input-field-group {
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .input-field-label {
        font-size: 11px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin-left: 2px;
      }

      .message-box {
        font-size: 13px;
        text-align: center;
        min-height: 20px;
        margin-top: 12px;
        font-weight: 600;
      }

      .message-box.error {
        color: var(--danger);
      }

      .message-box.success {
        color: var(--secondary);
      }
    </style>
  </head>

  <body>
    <!-- Ambient Glow Layer -->
    <div class="ambient-glow-mesh" aria-hidden="true">
      <div class="glow-orb-1"></div>
      <div class="glow-orb-2"></div>
    </div>

    <div class="auth-box">
      <!-- Logo Header -->
      <div class="auth-logo-header">
        <a href="index.html" style="text-decoration: none;">
          <div class="auth-logo-icon">
            <i class="fa-solid fa-crown"></i>
          </div>
        </a>
        <h2 style="font-size: 22px; font-weight: 800; color: var(--text-main);">
          Welcome to <span class="text-lime-gradient">TURFARENA</span>
        </h2>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
          Access live ground slots and squad matchmaking
        </p>
      </div>

      <!-- Segmented Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">
          <i class="fa-solid fa-lock"></i> Sign In
        </button>
        <button class="auth-tab-btn" id="tabRegister" onclick="switchAuthTab('register')">
          <i class="fa-solid fa-user-plus"></i> Sign Up
        </button>
      </div>

      <!-- Form -->
      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <!-- Name (Register Only) -->
        <div class="input-field-group" id="groupName" style="display: none;">
          <label class="input-field-label">Full Name</label>
          <input type="text" id="authName" class="input-premium" placeholder="Full name" />
        </div>

        <!-- Email -->
        <div class="input-field-group">
          <label class="input-field-label">Email Address</label>
          <input type="email" id="authEmail" class="input-premium" placeholder="name@example.com" required />
        </div>

        <!-- Phone (Register Only) -->
        <div class="input-field-group" id="groupPhone" style="display: none;">
          <label class="input-field-label">Mobile Number</label>
          <input type="tel" id="authPhone" class="input-premium" placeholder="10-digit phone number" />
        </div>

        <!-- Password -->
        <div class="input-field-group">
          <label class="input-field-label">Password</label>
          <input type="password" id="authPassword" class="input-premium" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary" id="authSubmitBtn" style="width: 100%; padding: 14px; margin-top: 8px;">
          Sign In to TurfArena
        </button>

        <div id="authMessage" class="message-box"></div>
      </form>

      <!-- Back Link -->
      <div style="margin-top: 24px; text-align: center; border-top: 1px solid var(--line-soft); padding-top: 16px;">
        <a href="index.html" style="color: var(--text-muted); font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
          <i class="fa-solid fa-arrow-left"></i> Back to Homepage
        </a>
      </div>
    </div>

    <!-- Scripts -->
    <script src="theme-toggle.js"></script>
    <script>
      let mode = "login";

      function switchAuthTab(newMode) {
        mode = newMode;
        document.getElementById("tabLogin").classList.toggle("active", mode === "login");
        document.getElementById("tabRegister").classList.toggle("active", mode === "register");

        document.getElementById("groupName").style.display = mode === "register" ? "flex" : "none";
        document.getElementById("groupPhone").style.display = mode === "register" ? "flex" : "none";

        document.getElementById("authSubmitBtn").textContent = mode === "login" ? "Sign In to TurfArena" : "Create Athlete Account";
        document.getElementById("authMessage").textContent = "";
      }

      async function handleAuthSubmit(e) {
        e.preventDefault();
        const msg = document.getElementById("authMessage");
        msg.className = "message-box";
        msg.textContent = "";

        const email = document.getElementById("authEmail").value.trim();
        const password = document.getElementById("authPassword").value;

        if (mode === "login") {
          try {
            const res = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Login failed");

            localStorage.setItem("currentUser", JSON.stringify(data.user));
            msg.className = "message-box success";
            msg.textContent = "Welcome back! Redirecting...";
            setTimeout(() => {
              window.location.href = data.user.role === "admin" ? "admin-dashboard.html" : "index.html";
            }, 800);
          } catch (err) {
            msg.className = "message-box error";
            msg.textContent = err.message;
          }
        } else {
          const name = document.getElementById("authName").value.trim();
          const phone = document.getElementById("authPhone").value.trim();

          if (!name || !phone) {
            msg.className = "message-box error";
            msg.textContent = "Please fill in all fields.";
            return;
          }

          if (!/^\d{10}$/.test(phone)) {
            msg.className = "message-box error";
            msg.textContent = "Please enter a valid 10-digit mobile number.";
            return;
          }

          try {
            const res = await fetch("/api/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ name, email, phone, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Registration failed");

            localStorage.setItem("currentUser", JSON.stringify(data.user));
            msg.className = "message-box success";
            msg.textContent = "Account created successfully! Redirecting...";
            setTimeout(() => {
              window.location.href = "index.html";
            }, 800);
          } catch (err) {
            msg.className = "message-box error";
            msg.textContent = err.message;
          }
        }
      }

      // Check existing session on load
      window.onload = async () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("mode") === "signup") {
          switchAuthTab("register");
        }

        try {
          const checkRes = await fetch("/api/auth/me", { credentials: "include" });
          if (checkRes.ok) {
            const data = await checkRes.json();
            if (data.user) {
              localStorage.setItem("currentUser", JSON.stringify(data.user));
              window.location.href = data.user.role === "admin" ? "admin-dashboard.html" : "index.html";
            }
          }
        } catch (e) {}
      };
    </script>
  </body>
</html>
